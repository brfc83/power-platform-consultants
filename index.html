    <!-- FAQ schema -->
    <script type="application/ld+json">
    {

      "mainEntity": [
        {
          "@type": "Question",
          "name": "What does a Power Platform consultant do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Power Platform consultant designs and builds solutions using Microsoft's suite of low-code tools — Power Apps, Power Automate, Copilot Studio, and Dynamics 365. This includes custom applications, automated workflows, AI agents, and data integrations that replace manual processes and connect business systems."
          }
        },
        {
          "@type": "Question",
          "name": "How much does Power Platform consulting cost in the UK?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Power Platform consulting day rates in the UK typically range from £500 to £900 per day depending on the consultant's experience and the complexity of the engagement. Forma Automate works on both time-and-materials and fixed-scope project models. Book a free 30-minute discovery call to discuss your requirements."
          }
        },
        {
          "@type": "Question",
          "name": "How long does a Power Platform project take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Project timescales vary by scope. A focused Power Automate flow can be delivered in days. A full Canvas App with custom connectors and ALM setup typically takes 4–12 weeks. Forma Automate scopes each project individually — book a discovery call to get a realistic timeline for your specific needs."
          }
        },
        {
          "@type": "Question",
          "name": "Do you work remotely or on-site in the UK?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Forma Automate is remote-first and based in London, UK. Most engagements are fully remote. On-site working in London or elsewhere in the UK can be arranged where the project genuinely benefits from it."
          }
        },
        {
          "@type": "Question",
          "name": "What sectors do you specialise in?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Forma Automate has delivered projects across aviation (easyJet), legal (Dentons), transport (TfL, Crossrail), financial regulation (Bermuda Monetary Authority), defence (QinetiQ), public sector (ORR), and consumer products (SharkNinja). This breadth means the right pattern for your sector is already understood."
          }
        },
        {
          "@type": "Question",
          "name": "Can you build Copilot Studio agents?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Forma Automate builds and deploys Microsoft Copilot Studio conversational agents — from internal helpdesk bots to customer-facing assistants. Agents can be connected to SharePoint knowledge bases, Dataverse, and Power Automate flows, and deployed via Microsoft Teams or embedded on websites."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between Canvas Apps and Model-driven Apps in Power Apps?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Canvas Apps give you full control over the layout and UI — ideal for focused, task-specific tools and mobile-first experiences. Model-driven Apps are built on top of Dataverse and generate the UI from your data model — better suited to complex business applications with relational data, views, and forms. Forma Automate builds both, and advises which is right for your use case."
          }
        },
        {
          "@type": "Question",
          "name": "Do you offer ongoing support after a project is delivered?",

            "text": "Yes. Forma Automate offers post-delivery support, documentation, and handover sessions to ensure your team can maintain and extend what has been built. Retainer arrangements are available for organisations that need ongoing Power Platform expertise."
          }
        }
